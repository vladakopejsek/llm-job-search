<!doctype html><html><head><script type="application/ld+json" data-nuxt-schema-org="true" data-hid="schema-org-graph">{"@context":"https://schema.org","@graph":[{"@id":"https://www.startupjobs.cz/#website","@type":"WebSite","inLanguage":"cs-CZ","url":"https://www.startupjobs.cz/","potentialAction":[{"@type":"SearchAction","target":{"@type":"EntryPoint","urlTemplate":"https://www.startupjobs.cz/nabidky?klicove-slovo={search_term_string}"},"query-input":{"@type":"PropertyValueSpecification","valueRequired":true,"valueName":"search_term_string"}}]},{"@id":"https://www.startupjobs.cz/nabidka/108033/tech-lead-node-js-typescript#job-posting","@type":"JobPosting","datePosted":"2026-09-23T14:02:45.000Z","description":"\u003Cp>Ahoj! 👋 Jsme Smartsupp a stavíme multichannel komunikační platformu pro e-shopy. Live chat, e-mail, Messenger i WhatsApp v jednom inboxu, k tomu chatboty a AI nákupní asistentku Mira. Vznikli jsme v Brně v roce 2013 a dnes nás používá přes 100 000 webů po celém světě. Každý měsíc obsloužíme stovky milionů návštěvníků a tři čtvrtiny tržeb máme ze zahraničí.\u003C/p>\u003Cp>Patříme do skupiny \u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.abugo.com/\">ABUGO\u003C/a>  společně s \u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.reservio.com/cs\">Reservio\u003C/a>, \u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.survio.com/cs/?_gl=1*m5pdni*_up*MQ..*_ga*OTgxMDUwNDMuMTc5MDE2NTc3MQ..*_ga_CRSKV0QXFL*czE3OTAxNjU3NzAkbzEkZzEkdDE3OTAxNjU3ODUkajQ1JGwwJGgw*_ga_0HPMCG420W*czE3OTAxNjU3NzAkbzEkZzEkdDE3OTAxNjU3ODUkajQ1JGwwJGgw\">Survio\u003C/a>, \u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.shopsys.com/\">Shopsys\u003C/a>, \u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.tanganica.com/cs\">Tanganicou\u003C/a> a \u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://soundsgood.cz/\">Sounds Good Agency\u003C/a>. Dohromady je nás přes 150, Smartsupp má ale vlastní stack, vlastní roadmapu a vlastní způsob práce.\u003C/p>\u003Cp>Platformu dál rozvíjíme a hledáme \u003Cstrong>hands-on Tech Leada\u003C/strong>, který převezme její technické směřování. Architektura, kvalita, technická roadmapa, mentoring. A stále blízko kódu.\u003C/p>\u003Ch3>\u003Cstrong>Co bude tvoje role? 🎯\u003C/strong>\u003C/h3>\u003Cp>Budeš technickým partnerem CEO, který má vývojářský background a dnes engineering vede přímo. Převezmeš odpovědnost za architekturu a technické standardy a společně s ním a s produktem budete rozhodovat, kudy se technicky vydáme. Parťáky na technická témata ale budeš mít i mimo Smartsupp: s Group CTO a tech leady ostatních firem ABUGO řešíme architekturu, AI workflow i zkušenosti z provozu a sdílíme know-how, tooling a společné standardy.\u003C/p>\u003Cp>Ve vývoji je nás 10, rozdělených do Core týmu (multichannel komunikace, inbox, integrace, dashboard, widget) a AI týmu (Mira). Řešení hledáme společně. Tvoje role je pojmenovat možnosti, dovést tým k rozhodnutí a stát za ním. Budeš vést technické diskuse, mentorovat a sám se pouštět do složitějších problémů v kódu.\u003C/p>\u003Ch3>\u003Cstrong>Co budeš mít na starost? 💻\u003C/strong>\u003C/h3>\u003Cul>\u003Cli>\u003Cp>\u003Cstrong>Architekturu platformy.\u003C/strong> Desítky mikroslužeb, real-time komunikace, integrace na e-commerce platformy a messaging kanály. Budeš rozhodovat, kde má systém růst, kde se zjednodušit a jak ho udržet srozumitelný pro tým.\u003C/p>\u003C/li>\u003Cli>\u003Cp>\u003Cstrong>Technickou roadmapu.\u003C/strong> Přeložíš stav systému a technický dluh do konkrétního backlogu s pojmenovanými trade-offy. Priority domluvíš s CEO a produktem.\u003C/p>\u003C/li>\u003Cli>\u003Cp>\u003Cstrong>Kvalitu a testovací strategii.\u003C/strong> Nastavíš, jak ověřujeme změny napříč službami a co musí být otestované před nasazením. Chyby se smí stát, ale musíme se o nich dozvědět dřív než zákazník.\u003C/p>\u003C/li>\u003Cli>\u003Cp>\u003Cstrong>Práci s AI v týmu.\u003C/strong> Určíš, co agent smí, jak ověřujeme jeho výsledek a kde nám AI reálně pomáhá odvést víc dobré práce.\u003C/p>\u003C/li>\u003Cli>\u003Cp>\u003Cstrong>Technické vedení a mentoring.\u003C/strong> Povedeš backend a frontend syncy i technická review. Pomůžeš kolegům růst a přebírat odpovědnost.\u003C/p>\u003C/li>\u003Cli>\u003Cp>\u003Cstrong>Spolupráci s produktem.\u003C/strong> Budeš u hledání řešení už ve chvíli, kdy vzniká produktový problém, ne až u hotového zadání.\u003C/p>\u003C/li>\u003C/ul>\u003Ch3>\u003Cstrong>Jaké technické výzvy řešíme? 🧠\u003C/strong>\u003C/h3>\u003Cp>Ať máš konkrétní představu, do čeho se u nás můžeš pustit:\u003C/p>\u003Cul>\u003Cli>\u003Cp>\u003Cstrong>Real-time chat a messaging\u003C/strong> pro přes 100 000 webů a stovky milionů návštěvníků měsíčně.\u003C/p>\u003C/li>\u003Cli>\u003Cp>\u003Cstrong>Změny napříč desítkami mikroslužeb.\u003C/strong> Kontraktní testy, integrační testy s Testcontainers, e2e na kritických scénářích, observabilita.\u003C/p>\u003C/li>\u003Cli>\u003Cp>\u003Cstrong>Mira AI.\u003C/strong> Produktové katalogy, RAG a vyhodnocování kvality odpovědí při hlídání nákladů a latence.\u003C/p>\u003C/li>\u003Cli>\u003Cp>\u003Cstrong>Integrace.\u003C/strong> Shopify, WooCommerce, PrestaShop, Magento a Shoptet; k tomu email, Messenger a WhatsApp.\u003C/p>\u003C/li>\u003Cli>\u003Cp>\u003Cstrong>Dohledatelnost problémů.\u003C/strong> Logování a monitoring, které umožní za minuty zjistit, co se stalo konkrétnímu zákazníkovi.\u003C/p>\u003C/li>\u003Cli>\u003Cp>\u003Cstrong>Vývoj s AI agenty.\u003C/strong> Jak navrhnout codebase a workflow, aby se v nich dobře pracovalo lidem i agentům.\u003C/p>\u003C/li>\u003C/ul>\u003Ch3>\u003Cstrong>S čím pracujeme? 🛠️\u003C/strong>\u003C/h3>\u003Cul>\u003Cli>\u003Cp>\u003Cstrong>Backend:\u003C/strong> Node.js, TypeScript, NestJS\u003C/p>\u003C/li>\u003Cli>\u003Cp>\u003Cstrong>Frontend:\u003C/strong> React, Svelte, TypeScript\u003C/p>\u003C/li>\u003Cli>\u003Cp>\u003Cstrong>Data:\u003C/strong> PostgreSQL, MariaDB, Elasticsearch\u003C/p>\u003C/li>\u003Cli>\u003Cp>\u003Cstrong>Infra:\u003C/strong> AWS v EU regionu, Kubernetes, ArgoCD, Grafana, Mezmo\u003C/p>\u003C/li>\u003Cli>\u003Cp>\u003Cstrong>Testy a kvalita:\u003C/strong> Jest, Playwright, CodeRabbit a GitHub Copilot review na každém PR\u003C/p>\u003C/li>\u003Cli>\u003Cp>\u003Cstrong>AI v produktu:\u003C/strong> LLM API od OpenAI a dalších poskytovatelů v Mira AI\u003C/p>\u003C/li>\u003Cli>\u003Cp>\u003Cstrong>AI ve vývoji:\u003C/strong> Claude Code, vlastní skilly a MCP integrace, pilot remote agentů na investigaci problémů\u003C/p>\u003C/li>\u003Cli>\u003Cp>\u003Cstrong>Spolupráce:\u003C/strong> GitHub, Linear, Slack\u003C/p>\u003C/li>\u003C/ul>\u003Cp>Nečekáme, že znáš každou technologii. Důležitější je silný základ v Node.js / TypeScript a zkušenost s návrhem i provozem systémů složených z více služeb.\u003C/p>\u003Ch3>\u003Cstrong>Koho hledáme? 👀\u003C/strong>\u003C/h3>\u003Cp>Někoho, kdo už technické rozhodování dělal a chce převzít odpovědnost za celou platformu.\u003C/p>\u003Cp>Sedneme si, pokud:\u003C/p>\u003Cul>\u003Cli>\u003Cp>máš 6+ let zkušeností s backendem, výraznou část v Node.js / TypeScript,\u003C/p>\u003C/li>\u003Cli>\u003Cp>navrhoval jsi systémy složené z více služeb a rozumíš jejich provozu, ne jen kódu,\u003C/p>\u003C/li>\u003Cli>\u003Cp>máš zkušenost s technickým vedením, ať už jsi titul tech leada měl, nebo ne,\u003C/p>\u003C/li>\u003Cli>\u003Cp>umíš vysvětlit trade-offy, naslouchat týmu a dovést diskusi k rozhodnutí,\u003C/p>\u003C/li>\u003Cli>\u003Cp>testy, review a observabilitu bereš jako standard,\u003C/p>\u003C/li>\u003Cli>\u003Cp>poznáš, kdy další abstrakce, služba nebo nástroj už nepřidává hodnotu,\u003C/p>\u003C/li>\u003Cli>\u003Cp>dáváš i přijímáš konkrétní zpětnou vazbu a zvládneš těžší rozhovor,\u003C/p>\u003C/li>\u003Cli>\u003Cp>AI nástroje používáš denně a rozumíš tomu, co posíláš do produkce.\u003C/p>\u003C/li>\u003C/ul>\u003Cp>Velkým plusem je zkušenost s některou z těchto oblastí:\u003C/p>\u003Cul>\u003Cli>\u003Cp>SaaS s velkým počtem menších zákazníků, PLG nebo freemium,\u003C/p>\u003C/li>\u003Cli>\u003Cp>real-time systémy, messaging nebo e-commerce integrace,\u003C/p>\u003C/li>\u003Cli>\u003Cp>LLM v produktu nebo zavádění AI nástrojů do týmového vývoje,\u003C/p>\u003C/li>\u003Cli>\u003Cp>AWS a Kubernetes v produkci,\u003C/p>\u003C/li>\u003Cli>\u003Cp>bezpečnost a compliance, například ISO 27001 nebo SOC2.\u003C/p>\u003C/li>\u003C/ul>\u003Cp>Nemusíš splňovat všechno. Pokud máš silný základ a část těchto věcí už jsi řešil, rádi se pobavíme.\u003C/p>\u003Ch3>\u003Cstrong>Jak bude vypadat výběrko? 🔮\u003C/strong>\u003C/h3>\u003Cp>Chceme poznat, jak přemýšlíš, a dát ti prostor poznat nás.\u003C/p>\u003Col>\u003Cli>\u003Cp>Krátký call s HR. Poznáme se a sladíme očekávání.\u003C/p>\u003C/li>\u003Cli>\u003Cp>Technické kolo s lidmi z dev týmu a Group CTO. Společně projdeme reálný problém z naší platformy, ne algoritmy na tabuli.\u003C/p>\u003C/li>\u003Cli>\u003Cp>Setkání s CEO Smartsuppu. Vedení týmu, roadmapa, priority.\u003C/p>\u003C/li>\u003C/ol>\u003Cp>Celé to zvládneme do dvou týdnů.\u003C/p>\u003Ch3>\u003Cstrong>Co dostaneš na oplátku? 🎁\u003C/strong>\u003C/h3>\u003Cul>\u003Cli>\u003Cp>Prostor ovlivnit architekturu, technickou roadmapu i způsob vývoje.\u003C/p>\u003C/li>\u003Cli>\u003Cp>Sdílené know-how napříč šesti firmami skupiny\u003C/p>\u003C/li>\u003Cli>\u003Cp>25 dní dovolené, 2 sick days\u003C/p>\u003C/li>\u003Cli>\u003Cp>Práci na dálku i z kanceláří ABUGO v centru Brna (vítěz kategorie IT kanceláře 2026).\u003C/p>\u003C/li>\u003Cli>\u003Cp>Vzdělávací rozpočet.\u003C/p>\u003C/li>\u003Cli>\u003Cp>Jazykové lekce\u003C/p>\u003C/li>\u003Cli>\u003Cp>MultiSport kartu.\u003C/p>\u003C/li>\u003Cli>\u003Cp>Dog-friendly kanceláře\u003C/p>\u003C/li>\u003Cli>\u003Cp>Firemní akce, offsity a teambuildingy\u003C/p>\u003C/li>\u003C/ul>\u003Ch3>\u003Cstrong>Zaujali jsme tě? 👋\u003C/strong>\u003C/h3>\u003Cp>Pošli nám CV nebo LinkedIn a pár vět o sobě. Zajímá nás hlavně, jaké technické rozhodnutí jsi udělal a dnes bys ho udělal jinak. Rádi ti Smartsupp představíme a probereme i to, co od další role čekáš ty.\u003C/p>","directApply":true,"jobBenefits":"Dovolená navíc, Homeoffice, Kariérní růst, Multisport karta, Notebook, Občerstvení na pracovišti, Odměny za odpracovaná léta, Originální kanceláře, Parkoviště, Pet-friendly office, Pružná pracovní doba, Přátelské prostředí, Relaxační zóna, Sick days, Skvělý tým profesionálů, Stabilní firma, Teambuilding, Výhodný mobilní tarif, Vzdělávací kurzy, Work life balance","qualifications":"Node.js, TypeScript, NestJS, PostgreSQL, MariaDB, ElasticSearch, Kubernetes, React JS, Svelte, Grafana, Playwright","skills":"Node.js, TypeScript, NestJS, PostgreSQL, MariaDB, ElasticSearch, Kubernetes, React JS, Svelte, Grafana, Playwright","title":"Tech Lead (Node.js / TypeScript)","url":"https://www.startupjobs.cz/nabidka/108033/tech-lead-node-js-typescript","employmentType":["FULL_TIME"],"hiringOrganization":{"@type":"Organization","name":"Smartsupp","logo":"https://assets.startupjobs.cz/LOGO/4749/d605a7b404c983b6e4b7a1a6777511f7.png","description":"Ahoj, jsme Smartsupp, součást skupiny ABUGO, a v Brně pracujeme na konverzační e-commerce platformě. Kombinujeme live chat, chatboty a AI, abychom firmám pomohli komunikovat se zákazníky, získávat kvalitní leady a zvyšovat prodeje.","url":"https://www.startupjobs.cz/startup/smartsupp","sameAs":"https://www.startupjobs.cz/startup/smartsupp"},"identifier":{"@type":"PropertyValue","name":"Smartsupp","value":"108033"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"Brno","addressRegion":"Jihomoravský kraj","addressCountry":"Česko"}}}]}</script></head><body></body></html>
